<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Excel風トーナメント表</title>
<style>
  body { font-family: sans-serif; background: #eee; }

  .bracket {
    display: flex;
    gap: 80px;
    align-items: flex-start;
    margin: 40px;
  }

  .round {
    display: flex;
    flex-direction: column;
    gap: 40px;
    position: relative;
  }

  .match {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .slot {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 4px 0;
  }

  .name {
    width: 100px;
    padding: 4px;
    border: 1px solid #aaa;
    background: #fff;
  }

  .btn {
    padding: 3px 6px;
    font-size: 12px;
    cursor: pointer;
  }

  .disabled {
    opacity: 0.5;
    pointer-events: none;
  }

  /* 線（枝） */
  .line {
    position: absolute;
    right: -40px;
    width: 40px;
    height: 2px;
    background: #000;
    top: 50%;
  }

  /* 勝利ライン（赤） */
  .win-line {
    position: absolute;
    right: -40px;
    width: 0;
    height: 2px;
    background: red;
    top: 50%;
    transition: width 0.4s ease-out;
  }
</style>
</head>
<body>

<h1 style="text-align:center;">Excel風トーナメント表</h1>

<div class="bracket">

  <!-- 1回戦 -->
  <div class="round" id="round1">
    <h2>1回戦</h2>
    <div class="match" data-next="r2m1">
      <div class="slot"><span class="name">府岐東</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">駿津大付</span><button class="btn win">勝ち</button></div>
      <div class="line"></div>
    </div>

    <div class="match" data-next="r2m1">
      <div class="slot"><span class="name">切祥商</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">麻港水産</span><button class="btn win">勝ち</button></div>
      <div class="line"></div>
    </div>

    <div class="match" data-next="r2m2">
      <div class="slot"><span class="name">萩崎工</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">玖嵩</span><button class="btn win">勝ち</button></div>
      <div class="line"></div>
    </div>

    <div class="match" data-next="r2m2">
      <div class="slot"><span class="name">宇小ヶ田</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">苔吹</span><button class="btn win">勝ち</button></div>
      <div class="line"></div>
    </div>

    <div class="match" data-next="r2m3">
      <div class="slot"><span class="name">赤更山</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">府岐東</span><button class="btn win">勝ち</button></div>
      <div class="line"></div>
    </div>
  </div>

  <!-- 2回戦 -->
  <div class="round">
    <h2>2回戦</h2>
    <div class="match" id="r2m1" data-next="r3m1">
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="line"></div>
    </div>

    <div class="match" id="r2m2" data-next="r3m1">
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="line"></div>
    </div>

    <div class="match" id="r2m3" data-next="final">
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="line"></div>
    </div>
  </div>

  <!-- 決勝 -->
  <div class="round">
    <h2>決勝</h2>
    <div class="match" id="final">
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <h3>優勝：<span id="champion"></span></h3>
    </div>
  </div>

</div>

<script>
document.addEventListener("click", e => {
  const btn = e.target;

  // 勝ちボタン
  if (btn.classList.contains("win")) {
    const slot = btn.closest(".slot");
    const winner = slot.querySelector(".name").textContent;
    const match = btn.closest(".match");
    const nextId = match.dataset.next;
    if (!nextId) return;

    const nextMatch = document.getElementById(nextId);
    const nextSlots = nextMatch.querySelectorAll(".slot .name");
    for (const ns of nextSlots) {
      if (!ns.textContent) {
        ns.textContent = winner;
        break;
      }
    }

    let line = match.querySelector(".win-line");
    if (!line) {
      line = document.createElement("div");
      line.className = "win-line";
      match.appendChild(line);
    }
    line.style.width = "40px";

    match.querySelectorAll(".win").forEach(b => b.classList.add("disabled"));
  }

  // 戻すボタン
  if (btn.classList.contains("undo")) {
    const match = btn.closest(".match");
    const slot = btn.closest(".slot");
    slot.querySelector(".name").textContent = "";

    const line = match.querySelector(".win-line");
    if (line) line.remove();

    match.querySelectorAll(".win").forEach(b => b.classList.remove("disabled"));

    const prevMatches = document.querySelectorAll(`[data-next="${match.id}"]`);
