<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>16人トーナメント（シンプル固定進行＋入力対応）</title>
<style>
  body {
    font-family: sans-serif;
    padding: 20px;
  }

  h1 { margin-bottom: 20px; }

  .bracket {
    display: flex;
    gap: 120px;
    align-items: flex-start;
  }

  .round {
    display: flex;
    flex-direction: column;
    gap: 40px;
    position: relative;
  }

  /* ★ 2回戦・準決勝・決勝の縦位置調整（しゅのコードを維持） */
  #round2 { margin-top: 60px; }
  #round3 { margin-top: 100px; }
  #final-round { margin-top: 140px; }

  .match {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fafafa;
    width: 200px;
  }

  .slot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 6px 0;
  }

  /* ★ 1回戦は入力欄 */
  .name-input {
    width: 110px;
    padding: 4px;
    border: 1px solid #aaa;
    background: #fff;
  }

  /* ★ 2回戦以降は span */
  .name {
    width: 110px;
    padding: 4px;
    border: 1px solid #aaa;
    background: #fff;
    min-height: 18px;
    display: inline-block;
  }

  .btn {
    padding: 4px 6px;
    font-size: 12px;
    cursor: pointer;
  }

  .disabled {
    opacity: 0.5;
    pointer-events: none;
  }

  #champion {
    font-weight: bold;
    color: #c33;
  }
</style>
</head>
<body>

<h1>16人トーナメント（シンプル固定進行＋入力対応）</h1>

<div class="bracket">

  <!-- 1回戦（入力可能） -->
  <div class="round" id="round1">
    <h2>1回戦</h2>

    <div class="match" id="r1m1">
      <div class="slot"><input class="name-input" value="P1"><button class="btn win">勝ち</button></div>
      <div class="slot"><input class="name-input" value="P2"><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m2">
      <div class="slot"><input class="name-input" value="P3"><button class="btn win">勝ち</button></div>
      <div class="slot"><input class="name-input" value="P4"><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m3">
      <div class="slot"><input class="name-input" value="P5"><button class="btn win">勝ち</button></div>
      <div class="slot"><input class="name-input" value="P6"><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m4">
      <div class="slot"><input class="name-input" value="P7"><button class="btn win">勝ち</button></div>
      <div class="slot"><input class="name-input" value="P8"><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m5">
      <div class="slot"><input class="name-input" value="P9"><button class="btn win">勝ち</button></div>
      <div class="slot"><input class="name-input" value="P10"><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m6">
      <div class="slot"><input class="name-input" value="P11"><button class="btn win">勝ち</button></div>
      <div class="slot"><input class="name-input" value="P12"><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m7">
      <div class="slot"><input class="name-input" value="P13"><button class="btn win">勝ち</button></div>
      <div class="slot"><input class="name-input" value="P14"><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m8">
      <div class="slot"><input class="name-input" value="P15"><button class="btn win">勝ち</button></div>
      <div class="slot"><input class="name-input" value="P16"><button class="btn win">勝ち</button></div>
    </div>
  </div>

  <!-- 2回戦 -->
  <div class="round" id="round2">
    <h2>2回戦</h2>

    <div class="match" id="r2m1">
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
    </div>

    <div style="padding-top: 10rem;">
      <div class="match" id="r2m2">
        <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
        <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      </div>
    </div>

    <div style="padding-top: 10rem;">
      <div class="match" id="r2m3">
        <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
        <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      </div>
    </div>

    <div style="padding-top: 10rem;">
      <div class="match" id="r2m4">
        <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
        <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      </div>
    </div>
  </div>

  <!-- 準決勝 -->
  <div class="round" id="round3">
    <h2>準決勝</h2>

    <div style="padding-top: 7rem;">
      <div class="match" id="r3m1">
        <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
        <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      </div>
    </div>

    <div style="padding-top: 29rem;">
      <div class="match" id="r3m2">
        <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
        <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      </div>
    </div>
  </div>

  <!-- 決勝 -->
  <div class="round" id="final-round">
    <h2>決勝</h2>

    <div style="padding-top: 20rem;">
      <div class="match" id="final">
        <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
        <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
        <h3>優勝：<span id="champion"></span></h3>
      </div>
    </div>
  </div>

</div>

<script>
/* ★ 固定進行表 */
const nextSlotMap = {
  r1m1: { next: "r2m1", slot: 0 },
  r1m2: { next: "r2m1", slot: 1 },
  r1m3: { next: "r2m2", slot: 0 },
  r1m4: { next: "r2m2", slot: 1 },
  r1m5: { next: "r2m3", slot: 0 },
  r1m6: { next: "r2m3", slot: 1 },
  r1m7: { next: "r2m4", slot: 0 },
  r1m8: { next: "r2m4", slot: 1 },

  r2m1: { next: "r3m1", slot: 0 },
  r2m2: { next: "r3m1", slot: 1 },
  r2m3: { next: "r3m2", slot: 0 },
  r2m4: { next: "r3m2", slot: 1 },

  r3m1: { next: "final", slot: 0 },
  r3m2: { next: "final", slot: 1 }
};

document.addEventListener("click", e => {
  const btn = e.target;
  if (!btn.classList.contains("win") && !btn.classList.contains("undo")) return;

  const slot = btn.closest(".slot");
  const match = btn.closest(".match");

  /* 勝ちボタン */
  if (btn.classList.contains("win")) {

    let winnerName = "";

    // 1回戦は input
    const input = slot.querySelector(".name-input");
    if (input) {
      winnerName = input.value.trim();
      input.disabled = true; // ★ 入力欄も無効化
    } else {
      // 2回戦以降は span
      const nameEl = slot.querySelector(".name");
      winnerName = nameEl.textContent.trim();
    }

    if (!winnerName) return;

    // 勝ちボタン無効化
    match.querySelectorAll(".win").forEach(b => b.classList.add("disabled"));

    // 次へ反映
    const info = nextSlotMap[match.id];
    if (info) {
      const nextMatch = document.getElementById(info.next);
      const nextSlots = nextMatch.querySelectorAll(".slot .name");
      const target = nextSlots[info.slot];

      target.textContent = winnerName;
      target.closest(".slot").dataset.from = match.id;
    }

    if (match.id === "final") {
      document.getElementById("champion").textContent = winnerName;
    }
  }

  /* 戻すボタン */
  if (btn.classList.contains("undo")) {

    // 1回戦なら input を復活
    const input = slot.querySelector(".name-input");
    if (input) {
      input.disabled = false;
    }

    // span の場合は消す
    const nameEl = slot.querySelector(".name");
    if (nameEl) nameEl.textContent = "";

    // 勝ちボタン復活
    match.querySelectorAll(".win").forEach(b => b.classList.remove("disabled"));

    // 元の試合の勝ちボタンも復活
    const fromMatchId = slot.dataset.from;
    if (fromMatchId) {
      const prevMatch = document.getElementById(fromMatchId);
      prevMatch.querySelectorAll(".win").forEach(b => b.classList.remove("disabled"));
    }

    delete slot.dataset.from;

    if (match.id === "final") {
      document.getElementById("champion").textContent = "";
    }
  }
});
</script>

</body>
</html>
