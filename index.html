<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>シンプルトーナメント（固定進行）</title>
<style>
  :root{
    --gap:18px;
    --slot-h:40px;
    --name-w:160px;
    --btn-pad:6px 8px;
    --muted:#888;
    --accent:#c33;
    --bg:#fafafa;
    --border:#ddd;
  }

  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: var(--bg);
    color:#222;
    padding:24px;
  }

  h1{ margin:0 0 18px 0; font-size:18px; }

  .container{
    display:flex;
    gap:40px;
    align-items:flex-start;
    flex-wrap:wrap;
  }

  .column{
    background:#fff;
    border:1px solid var(--border);
    padding:12px;
    border-radius:8px;
    min-width:260px;
  }

  .round-title{
    font-weight:700;
    margin:0 0 8px 0;
    font-size:14px;
  }

  .match{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:8px;
    border-radius:6px;
    border:1px solid transparent;
    margin-bottom:12px;
    min-height: calc(var(--slot-h) * 2 + var(--gap));
    background:linear-gradient(180deg, rgba(0,0,0,0.01), transparent);
  }

  .match.highlight{
    box-shadow:0 0 0 2px rgba(200,50,50,0.06);
  }

  .slot{
    display:flex;
    align-items:center;
    gap:10px;
    height:var(--slot-h);
  }

  .name{
    width:var(--name-w);
    padding:6px 8px;
    border:1px solid var(--border);
    border-radius:4px;
    background:#fff;
    box-sizing:border-box;
  }

  .name.empty{ color:var(--muted); background:#fff; }

  .controls{
    display:flex;
    gap:8px;
    margin-left:auto;
  }

  .btn{
    padding:var(--btn-pad);
    font-size:13px;
    border-radius:6px;
    border:1px solid var(--border);
    background:#fff;
    cursor:pointer;
  }

  .btn.win{
    background:linear-gradient(#fff,#ffecec);
    border-color:#f2c6c6;
  }

  .btn.undo{
    background:linear-gradient(#fff,#f3f7ff);
    border-color:#c6d7f2;
  }

  .btn.disabled{
    opacity:0.45;
    pointer-events:none;
  }

  .note{
    margin-top:8px;
    font-size:13px;
    color:var(--muted);
  }

  .champion{
    margin-top:12px;
    font-weight:700;
    color:var(--accent);
  }

  /* 小さい画面で横並び崩れないように */
  @media (max-width:720px){
    .container{ flex-direction:column; gap:12px; }
  }
</style>
</head>
<body>

<h1>シンプルトーナメント（固定進行）</h1>

<div class="container">

  <!-- 1回戦列 -->
  <div class="column" id="col-round1">
    <div class="round-title">1回戦</div>

    <div class="match" id="r1m1" data-next="r2m1">
      <div class="slot">
        <span class="name">P1</span>
        <div class="controls">
          <button class="btn win">勝ち</button>
        </div>
      </div>
      <div class="slot">
        <span class="name">P2</span>
        <div class="controls">
          <button class="btn win">勝ち</button>
        </div>
      </div>
    </div>

    <div class="match" id="r1m2" data-next="r2m1">
      <div class="slot">
        <span class="name">P3</span>
        <div class="controls">
          <button class="btn win">勝ち</button>
        </div>
      </div>
      <div class="slot">
        <span class="name">P4</span>
        <div class="controls">
          <button class="btn win">勝ち</button>
        </div>
      </div>
    </div>

    <div class="match" id="r1m3" data-next="r2m2">
      <div class="slot">
        <span class="name">P5</span>
        <div class="controls">
          <button class="btn win">勝ち</button>
        </div>
      </div>
      <div class="slot">
        <span class="name">P6</span>
        <div class="controls">
          <button class="btn win">勝ち</button>
        </div>
      </div>
    </div>

    <div class="match" id="r1m4" data-next="r2m2">
      <div class="slot">
        <span class="name">P7</span>
        <div class="controls">
          <button class="btn win">勝ち</button>
        </div>
      </div>
      <div class="slot">
        <span class="name">P8</span>
        <div class="controls">
          <button class="btn win">勝ち</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 2回戦列 -->
  <div class="column" id="col-round2">
    <div class="round-title">2回戦</div>

    <div class="match" id="r2m1" data-next="r3m1">
      <div class="slot">
        <span class="name empty"></span>
        <div class="controls">
          <button class="btn win">勝ち</button>
          <button class="btn undo">戻す</button>
        </div>
      </div>
      <div class="slot">
        <span class="name empty"></span>
        <div class="controls">
          <button class="btn win">勝ち</button>
          <button class="btn undo">戻す</button>
        </div>
      </div>
    </div>

    <div class="match" id="r2m2" data-next="r3m1">
      <div class="slot">
        <span class="name empty"></span>
        <div class="controls">
          <button class="btn win">勝ち</button>
          <button class="btn undo">戻す</button>
        </div>
      </div>
      <div class="slot">
        <span class="name empty"></span>
        <div class="controls">
          <button class="btn win">勝ち</button>
          <button class="btn undo">戻す</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 準決勝 / 決勝列 -->
  <div class="column" id="col-final">
    <div class="round-title">準決勝 / 決勝</div>

    <div class="match" id="r3m1" data-next="final">
      <div class="slot">
        <span class="name empty"></span>
        <div class="controls">
          <button class="btn win">勝ち</button>
          <button class="btn undo">戻す</button>
        </div>
      </div>
      <div class="slot">
        <span class="name empty"></span>
        <div class="controls">
          <button class="btn win">勝ち</button>
          <button class="btn undo">戻す</button>
        </div>
      </div>
    </div>

    <div class="match" id="final">
      <div class="slot">
        <span class="name empty"></span>
        <div class="controls">
          <button class="btn win">勝ち</button>
          <button class="btn undo">戻す</button>
        </div>
      </div>
      <div class="slot">
        <span class="name empty"></span>
        <div class="controls">
          <button class="btn win">勝ち</button>
          <button class="btn undo">戻す</button>
        </div>
      </div>

      <div class="champion">優勝： <span id="champion"></span></div>
    </div>
  </div>

</div>

<script>
/*
  仕様
  - トーナメント線は完全に削除（視覚要素なし）
  - 進行は固定： r1m1/r1m2 -> r2m1, r1m3/r1m4 -> r2m2, r2m1/r2m2 -> r3m1, r3m1/r3m2 -> final
  - 勝ちボタンを押すと data-next に従って次のマッチの最初の空きスロットに勝者名を入れる
  - undo ボタンでそのスロットの名前を消す（前のマッチのボタンは復活しない簡易仕様）
  - final の勝利で優勝者表示
*/

document.addEventListener("click", (e) => {
  const btn = e.target;
  if (!btn.classList.contains("win") && !btn.classList.contains("undo")) return;

  const slotEl = btn.closest(".slot");
  const matchEl = btn.closest(".match");

  // 勝ちボタン処理
  if (btn.classList.contains("win")) {
    const nameEl = slotEl.querySelector(".name");
    const winnerName = nameEl.textContent.trim();
    if (!winnerName) return; // 名前が空なら何もしない

    // 無効化（そのマッチの勝ちボタンを無効化）
    matchEl.querySelectorAll(".win").forEach(b => b.classList.add("disabled"));

    // 次のマッチへ反映（data-next に従う）
    const nextId = matchEl.dataset.next;
    if (nextId) {
      const nextMatch = document.getElementById(nextId);
      if (nextMatch) {
        const nextNameEls = nextMatch.querySelectorAll(".slot .name");
        for (const ne of nextNameEls) {
          if (!ne.textContent.trim()) {
            ne.textContent = winnerName;
            ne.classList.remove("empty");
            break;
          }
        }
      }
    }

    // final の優勝表示
    if (matchEl.id === "final") {
      document.getElementById("champion").textContent = winnerName;
    }
    return;
  }

  // 戻すボタン処理
  if (btn.classList.contains("undo")) {
    const nameEl = slotEl.querySelector(".name");
    // 名前を消す
    nameEl.textContent = "";
    nameEl.classList.add("empty");

    // そのマッチの勝ちボタンを復活
    const match = btn.closest(".match");
    match.querySelectorAll(".win").forEach(b => b.classList.remove("disabled"));

    // final の優勝表示クリア（もし final のスロットが消された場合）
    if (match.id === "final") {
      document.getElementById("champion").textContent = "";
    }
    return;
  }
});
</script>

</body>
</html>
