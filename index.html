<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>16人トーナメント（横向き）</title>
<style>
  body { font-family: sans-serif; }

  .round {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin: 20px 0;
  }

  .match {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .slot {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .name {
    width: 100px;
    padding: 4px;
    border: 1px solid #aaa;
    background: #fff;
  }

  .line {
    position: absolute;
    width: 2px;
    background: black;
  }

  /* 1回戦の線（上に伸びる） */
  .line-up {
    height: 40px;
    bottom: 0;
  }

  /* 2回戦の線（下に伸びる） */
  .line-down {
    height: 40px;
    top: 0;
  }

</style>
</head>
<body>

<h1 style="text-align:center;">16人トーナメント（横向きピラミッド）</h1>

<!-- 1回戦（横一列） -->
<div class="round" id="round1">
  <div class="match" data-next="r2m1">
    <div class="slot"><span class="name">P1</span><button>勝ち</button></div>
    <div class="slot"><span class="name">P2</span><button>勝ち</button></div>
    <div class="line line-up"></div>
  </div>

  <div class="match" data-next="r2m1">
    <div class="slot"><span class="name">P3</span><button>勝ち</button></div>
    <div class="slot"><span class="name">P4</span><button>勝ち</button></div>
    <div class="line line-up"></div>
  </div>

  <div class="match" data-next="r2m2">
    <div class="slot"><span class="name">P5</span><button>勝ち</button></div>
    <div class="slot"><span class="name">P6</span><button>勝ち</button></div>
    <div class="line line-up"></div>
  </div>

  <div class="match" data-next="r2m2">
    <div class="slot"><span class="name">P7</span><button>勝ち</button></div>
    <div class="slot"><span class="name">P8</span><button>勝ち</button></div>
    <div class="line line-up"></div>
  </div>

  <div class="match" data-next="r2m3">
    <div class="slot"><span class="name">P9</span><button>勝ち</button></div>
    <div class="slot"><span class="name">P10</span><button>勝ち</button></div>
    <div class="line line-up"></div>
  </div>

  <div class="match" data-next="r2m3">
    <div class="slot"><span class="name">P11</span><button>勝ち</button></div>
    <div class="slot"><span class="name">P12</span><button>勝ち</button></div>
    <div class="line line-up"></div>
  </div>

  <div class="match" data-next="r2m4">
    <div class="slot"><span class="name">P13</span><button>勝ち</button></div>
    <div class="slot"><span class="name">P14</span><button>勝ち</button></div>
    <div class="line line-up"></div>
  </div>

  <div class="match" data-next="r2m4">
    <div class="slot"><span class="name">P15</span><button>勝ち</button></div>
    <div class="slot"><span class="name">P16</span><button>勝ち</button></div>
    <div class="line line-up"></div>
  </div>
</div>

<!-- 2回戦（1回戦の間に配置） -->
<div class="round" id="round2">
  <div class="match" id="r2m1">
    <div class="slot"><span class="name"></span><button>勝ち</button></div>
    <div class="slot"><span class="name"></span><button>勝ち</button></div>
    <div class="line line-down"></div>
  </div>

  <div class="match" id="r2m2">
    <div class="slot"><span class="name"></span><button>勝ち</button></div>
    <div class="slot"><span class="name"></span><button>勝ち</button></div>
    <div class="line line-down"></div>
  </div>

  <div class="match" id="r2m3">
    <div class="slot"><span class="name"></span><button>勝ち</button></div>
    <div class="slot"><span class="name"></span><button>勝ち</button></div>
    <div class="line line-down"></div>
  </div>

  <div class="match" id="r2m4">
    <div class="slot"><span class="name"></span><button>勝ち</button></div>
    <div class="slot"><span class="name"></span><button>勝ち</button></div>
    <div class="line line-down"></div>
  </div>
</div>

</body>
</html>
