<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>16人トーナメント（グリッド版・位置完全固定＋線あり）</title>
<style>
  body { font-family: sans-serif; }

  .bracket {
    display: flex;
    gap: 140px;
    align-items: flex-start;
  }

  /* 各ラウンドを同じ縦グリッドに乗せる */
  .round {
    display: grid;
    grid-template-rows: repeat(16, 40px); /* 16段のマス目 */
    row-gap: 0;
    position: relative;
    min-height: 640px;
  }

  .round > h2 {
    grid-row: 1 / 2;
    margin-bottom: 10px;
  }

  .match {
    position: relative;
    padding-left: 20px;
  }

  .slot {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 4px 0;
  }

  .name {
    width: 120px;
    padding: 4px;
    border: 1px solid #aaa;
    background: #fff;
  }

  .btn {
    padding: 3px 6px;
    font-size: 12px;
    cursor: pointer;
  }

  /* 勝利ライン（縦） */
  .win-line {
    position: absolute;
    width: 3px;
    background: red;
    left: 0px;
    bottom: 0;
    height: 0;
    transition: height 0.4s ease-out;
  }

  .disabled {
    opacity: 0.5;
    pointer-events: none;
  }

  /* 階段線（L字）＋アニメーション */
  .step-line {
    position: absolute;
    left: 150px;
    top: 50%;
    transform: translateY(-50%);
    width: 0px;
    height: 2px;
    background: black;
    transition: width 0.4s ease-out;
  }

  .step-line::after {
    content: "";
    position: absolute;
    right: 0;
    top: 0;
    width: 2px;
    height: 0px;
    background: black;
    transition: height 0.4s ease-out;
  }

  .step-line.active {
    width: 40px;
    background: red;
  }

  .step-line.active::after {
    height: 40px;
    background: red;
  }

  /* ★ 行割り当て：ここが「この字」になる肝 */

  /* 1回戦：8試合を縦に並べる */
  #r1m1 { grid-row: 2 / 4; }
  #r1m2 { grid-row: 4 / 6; }
  #r1m3 { grid-row: 6 / 8; }
  #r1m4 { grid-row: 8 / 10; }
  #r1m5 { grid-row: 10 / 12; }
  #r1m6 { grid-row: 12 / 14; }
  #r1m7 { grid-row: 14 / 16; }
  #r1m8 { grid-row: 16 / 18; } /* ちょっと下に余裕を持たせる */

  /* 2回戦：1回戦の間に来るように */
  /* r2m1 は r1m1(2-4) と r1m2(4-6) の間 → 3-5 あたり */
  #r2m1 { grid-row: 3 / 5; }
  /* r2m2 は r1m3(6-8) と r1m4(8-10) の間 → 7-9 */
  #r2m2 { grid-row: 7 / 9; }
  /* r2m3 は r1m5(10-12) と r1m6(12-14) の間 → 11-13 */
  #r2m3 { grid-row: 11 / 13; }
  /* r2m4 は r1m7(14-16) と r1m8(16-18) の間 → 15-17 */
  #r2m4 { grid-row: 15 / 17; }

  /* 準決勝：2回戦の間に来るように */
  /* r3m1 は r2m1(3-5) と r2m2(7-9) の間 → 5-7 */
  #r3m1 { grid-row: 5 / 7; }
  /* r3m2 は r2m3(11-13) と r2m4(15-17) の間 → 13-15 */
  #r3m2 { grid-row: 13 / 15; }

  /* 決勝：準決勝の間に来るように */
  /* final は r3m1(5-7) と r3m2(13-15) の間 → 9-11 */
  #final { grid-row: 9 / 11; }

  /* 決勝の「優勝」表示は少し下に */
  #final h3 {
    margin-top: 20px;
  }

</style>
</head>
<body>

<h1>16人トーナメント（グリッド版・位置完全固定＋線あり）</h1>

<div class="bracket">

  <!-- 1回戦 -->
  <div class="round" id="round1">
    <h2>1回戦</h2>

    <div class="match" id="r1m1" data-next="r2m1">
      <div class="slot"><span class="name">P1</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P2</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m2" data-next="r2m1">
      <div class="slot"><span class="name">P3</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P4</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m3" data-next="r2m2">
      <div class="slot"><span class="name">P5</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P6</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m4" data-next="r2m2">
      <div class="slot"><span class="name">P7</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P8</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m5" data-next="r2m3">
      <div class="slot"><span class="name">P9</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P10</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m6" data-next="r2m3">
      <div class="slot"><span class="name">P11</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P12</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m7" data-next="r2m4">
      <div class="slot"><span class="name">P13</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P14</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m8" data-next="r2m4">
      <div class="slot"><span class="name">P15</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P16</span><button class="btn win">勝ち</button></div>
    </div>
  </div>

  <!-- 2回戦 -->
  <div class="round">
    <h2>2回戦</h2>

    <div class="match" id="r2m1" data-next="r3m1">
      <div class="slot" data-prev="r1m1"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r1m2"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="step-line"></div>
    </div>

    <div class="match" id="r2m2" data-next="r3m1">
      <div class="slot" data-prev="r1m3"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r1m4"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="step-line"></div>
    </div>

    <div class="match" id="r2m3" data-next="r3m2">
      <div class="slot" data-prev="r1m5"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r1m6"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="step-line"></div>
    </div>

    <div class="match" id="r2m4" data-next="r3m2">
      <div class="slot" data-prev="r1m7"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r1m8"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="step-line"></div>
    </div>
  </div>

  <!-- 準決勝 -->
  <div class="round">
    <h2>準決勝</h2>

    <div class="match" id="r3m1" data-next="final">
      <div class="slot" data-prev="r2m1"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r2m2"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="step-line"></div>
    </div>

    <div class="match" id="r3m2" data-next="final">
      <div class="slot" data-prev="r2m3"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r2m4"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="step-line"></div>
    </div>
  </div>

  <!-- 決勝 -->
  <div class="round">
    <h2>決勝</h2>

    <div class="match" id="final">
      <div class="slot" data-prev="r3m1"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r3m2"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>

      <h3>優勝：<span id="champion"></span></h3>
      <div class="step-line"></div>
    </div>
  </div>

</div>

<script>
document.addEventListener("click", e => {
  const btn = e.target;

  // 勝ちボタン
  if (btn.classList.contains("win")) {
    const slot = btn.closest(".slot");
    const match = btn.closest(".match");
    const winnerName = slot.querySelector(".name").textContent;

    const nextId = match.dataset.next;
    if (nextId) {
      const nextMatch = document.getElementById(nextId);
      const nextSlots = nextMatch.querySelectorAll(".slot .name");
      for (const ns of nextSlots) {
        if (!ns.textContent) {
          ns.textContent = winnerName;
          break;
        }
      }
    }

    slot.dataset.winner = "true";

    let line = match.querySelector(".win-line");
    if (!line) {
      line = document.createElement("div");
      line.className = "win-line";
      match.appendChild(line);
    }
    const slotRect = slot.getBoundingClientRect();
    const matchRect = match.getBoundingClientRect();
    const height = slotRect.top - matchRect.top;
    line.style.height = height + "px";

    match.querySelectorAll(".win").forEach(b => b.classList.add("disabled"));

    const step = match.querySelector(".step-line");
    if (step) step.classList.add("active");

    if (match.id === "final") {
      document.getElementById("champion").textContent = winnerName;
    }
  }

  // 戻すボタン
  if (btn.classList.contains("undo")) {
    const slot = btn.closest(".slot");
    const match = btn.closest(".match");

    slot.querySelector(".name").textContent = "";

    const line = match.querySelector(".win-line");
    if (line) line.remove();

    match.querySelectorAll(".win").forEach(b => b.classList.remove("disabled"));

    const prevMatchId = slot.dataset.prev;
    if (prevMatchId) {
      const prevMatch = document.getElementById(prevMatchId);
      if (prevMatch) {
        prevMatch.querySelectorAll(".win").forEach(b => b.classList.remove("disabled"));
      }
    }

    delete slot.dataset.winner;

    const step = match.querySelector(".step-line");
    if (step) step.classList.remove("active");

    if (match.id === "final") {
      document.getElementById("champion").textContent = "";
    }
  }
});
</script>

</body>
</html>
