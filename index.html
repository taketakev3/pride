<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>16人トーナメント（デフォルト線＋赤変色＋位置修正）</title>
<style>
  body { font-family: sans-serif; }

  .bracket {
    display: flex;
    gap: 140px;
    align-items: flex-start;
  }

  .round {
    display: flex;
    flex-direction: column;
    gap: 60px;
    position: relative;
  }

  .match {
    position: relative;
    padding-left: 20px;
    min-height: 80px;
  }

  .slot {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 6px 0;
  }

  .name {
    width: 120px;
    padding: 4px;
    border: 1px solid #aaa;
    background: #fff;
  }

  .btn {
    padding: 3px 6px;
    font-size: 12px;
    cursor: pointer;
  }

  /* 勝利ライン（縦） */
  .win-line {
    position: absolute;
    width: 3px;
    background: red;
    left: 0px;
    bottom: 0;
    height: 0;
    transition: height 0.4s ease-out;
  }

  .disabled {
    opacity: 0.5;
    pointer-events: none;
  }

  /* ★ デフォルトのトーナメント線（スクショ風） */
  /* 1回戦 → 2回戦への線（左側） */
  .round-lines {
    position: absolute;
    left: 140px; /* 名前の右あたりから線を出す */
    top: 40px;
    width: 100px;
    height: 600px;
    pointer-events: none;
  }

  .round-lines svg {
    width: 100%;
    height: 100%;
  }

  .round-lines line {
    stroke: black;
    stroke-width: 3;
  }

  .round-lines line.active {
    stroke: red;
  }

  /* 2回戦 → 準決勝、準決勝 → 決勝も同じように線を描画 */
  .round2-lines {
    position: absolute;
    left: 140px;
    top: 70px;
    width: 100px;
    height: 540px;
    pointer-events: none;
  }

  .round3-lines {
    position: absolute;
    left: 140px;
    top: 100px;
    width: 100px;
    height: 480px;
    pointer-events: none;
  }

  .round2-lines svg,
  .round3-lines svg {
    width: 100%;
    height: 100%;
  }

  .round2-lines line,
  .round3-lines line {
    stroke: black;
    stroke-width: 3;
  }

  .round2-lines line.active,
  .round3-lines line.active {
    stroke: red;
  }

  /* ★ 位置調整：何回戦の「間」に来るように */
  /* 2回戦のラウンド全体を少し下げて、1回戦の間に見えるようにする */
  .round:nth-child(2) { margin-top: 30px; }
  .round:nth-child(3) { margin-top: 60px; }
  .round:nth-child(4) { margin-top: 90px; }

</style>
</head>
<body>

<h1>16人トーナメント（デフォルト線＋赤変色＋位置修正）</h1>

<div class="bracket">

  <!-- 1回戦 -->
  <div class="round" id="round1">
    <h2>1回戦</h2>

    <div class="match" id="r1m1" data-next="r2m1">
      <div class="slot"><span class="name">P1</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P2</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m2" data-next="r2m1">
      <div class="slot"><span class="name">P3</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P4</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m3" data-next="r2m2">
      <div class="slot"><span class="name">P5</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P6</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m4" data-next="r2m2">
      <div class="slot"><span class="name">P7</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P8</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m5" data-next="r2m3">
      <div class="slot"><span class="name">P9</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P10</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m6" data-next="r2m3">
      <div class="slot"><span class="name">P11</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P12</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m7" data-next="r2m4">
      <div class="slot"><span class="name">P13</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P14</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m8" data-next="r2m4">
      <div class="slot"><span class="name">P15</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P16</span><button class="btn win">勝ち</button></div>
    </div>

    <!-- 1回戦→2回戦へのデフォルト線（スクショ風） -->
    <div class="round-lines">
      <svg>
        <!-- r1m1 & r1m2 → r2m1 -->
        <line id="line-r1m1-r2m1" x1="0" y1="20" x2="40" y2="20" />
        <line x1="40" y1="20" x2="40" y2="50" />
        <line x1="40" y1="50" x2="80" y2="50" />

        <line id="line-r1m2-r2m1" x1="0" y1="80" x2="40" y2="80" />
        <line x1="40" y1="80" x2="40" y2="50" />
        <line x1="40" y1="50" x2="80" y2="50" />

        <!-- r1m3 & r1m4 → r2m2 -->
        <line id="line-r1m3-r2m2" x1="0" y1="140" x2="40" y2="140" />
        <line x1="40" y1="140" x2="40" y2="170" />
        <line x1="40" y1="170" x2="80" y2="170" />

        <line id="line-r1m4-r2m2" x1="0" y1="200" x2="40" y2="200" />
        <line x1="40" y1="200" x2="40" y2="170" />
        <line x1="40" y1="170" x2="80" y2="170" />

        <!-- r1m5 & r1m6 → r2m3 -->
        <line id="line-r1m5-r2m3" x1="0" y1="260" x2="40" y2="260" />
        <line x1="40" y1="260" x2="40" y2="290" />
        <line x1="40" y1="290" x2="80" y2="290" />

        <line id="line-r1m6-r2m3" x1="0" y1="320" x2="40" y2="320" />
        <line x1="40" y1="320" x2="40" y2="290" />
        <line x1="40" y1="290" x2="80" y2="290" />

        <!-- r1m7 & r1m8 → r2m4 -->
        <line id="line-r1m7-r2m4" x1="0" y1="380" x2="40" y2="380" />
        <line x1="40" y1="380" x2="40" y2="410" />
        <line x1="40" y1="410" x2="80" y2="410" />

        <line id="line-r1m8-r2m4" x1="0" y1="440" x2="40" y2="440" />
        <line x1="40" y1="440" x2="40" y2="410" />
        <line x1="40" y1="410" x2="80" y2="410" />
      </svg>
    </div>
  </div>

  <!-- 2回戦 -->
  <div class="round">
    <h2>2回戦</h2>

    <div class="match" id="r2m1" data-next="r3m1">
      <div class="slot" data-prev="r1m1"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r1m2"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
    </div>

    <div class="match" id="r2m2" data-next="r3m1">
      <div class="slot" data-prev="r1m3"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r1m4"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
    </div>

    <div class="match" id="r2m3" data-next="r3m2">
      <div class="slot" data-prev="r1m5"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r1m6"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
    </div>

    <div class="match" id="r2m4" data-next="r3m2">
      <div class="slot" data-prev="r1m7"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r1m8"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
    </div>

    <!-- 2回戦→準決勝への線 -->
    <div class="round2-lines">
      <svg>
        <!-- r2m1 & r2m2 → r3m1 -->
        <line id="line-r2m1-r3m1" x1="0" y1="50" x2="40" y2="50" />
        <line x1="40" y1="50" x2="40" y2="110" />
        <line x1="40" y1="110" x2="80" y2="110" />

        <line id="line-r2m2-r3m1" x1="0" y1="170" x2="40" y2="170" />
        <line x1="40" y1="170" x2="40" y2="110" />
        <line x1="40" y1="110" x2="80" y2="110" />

        <!-- r2m3 & r2m4 → r3m2 -->
        <line id="line-r2m3-r3m2" x1="0" y1="290" x2="40" y2="290" />
        <line x1="40" y1="290" x2="40" y2="350" />
        <line x1="40" y1="350" x2="80" y2="350" />

        <line id="line-r2m4-r3m2" x1="0" y1="410" x2="40" y2="410" />
        <line x1="40" y1="410" x2="40" y2="350" />
        <line x1="40" y1="350" x2="80" y2="350" />
      </svg>
    </div>
  </div>

  <!-- 準決勝 -->
  <div class="round">
    <h2>準決勝</h2>

    <div class="match" id="r3m1" data-next="final">
      <div class="slot" data-prev="r2m1"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r2m2"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
    </div>

    <div class="match" id="r3m2" data-next="final">
      <div class="slot" data-prev="r2m3"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r2m4"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
    </div>

    <!-- 準決勝→決勝への線 -->
    <div class="round3-lines">
      <svg>
        <!-- r3m1 & r3m2 → final -->
        <line id="line-r3m1-final" x1="0" y1="80" x2="40" y2="80" />
        <line x1="40" y1="80" x2="40" y2="160" />
        <line x1="40" y1="160" x2="80" y2="160" />

        <line id="line-r3m2-final" x1="0" y1="200" x2="40" y2="200" />
        <line x1="40" y1="200" x2="40" y2="160" />
        <line x1="40" y1="160" x2="80" y2="160" />
      </svg>
    </div>
  </div>

  <!-- 決勝 -->
  <div class="round">
    <h2>決勝</h2>

    <div class="match" id="final">
      <div class="slot" data-prev="r3m1"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>
      <div class="slot" data-prev="r3m2"><span class="name"></span>
        <button class="btn win">勝ち</button><button class="btn undo">戻す</button>
      </div>

      <h3>優勝：<span id="champion"></span></h3>
    </div>
  </div>

</div>

<script>
document.addEventListener("click", e => {
  const btn = e.target;

  // 勝ちボタン
  if (btn.classList.contains("win")) {
    const slot = btn.closest(".slot");
    const match = btn.closest(".match");
    const winnerName = slot.querySelector(".name").textContent;

    const nextId = match.dataset.next;
    if (nextId) {
      const nextMatch = document.getElementById(nextId);
      const nextSlots = nextMatch.querySelectorAll(".slot .name");
      for (const ns of nextSlots) {
        if (!ns.textContent) {
          ns.textContent = winnerName;
          break;
        }
      }
    }

    slot.dataset.winner = "true";

    let line = match.querySelector(".win-line");
    if (!line) {
      line = document.createElement("div");
      line.className = "win-line";
      match.appendChild(line);
    }
    const slotRect = slot.getBoundingClientRect();
    const matchRect = match.getBoundingClientRect();
    const height = slotRect.top - matchRect.top;
    line.style.height = height + "px";

    match.querySelectorAll(".win").forEach(b => b.classList.add("disabled"));

    /* ★ デフォルト線を赤くする（スクショ風） */
    const mid = match.id;
    if (mid === "r1m1") {
      document.getElementById("line-r1m1-r2m1").classList.add("active");
    }
    if (mid === "r1m2") {
      document.getElementById("line-r1m2-r2m1").classList.add("active");
    }
    if (mid === "r1m3") {
      document.getElementById("line-r1m3-r2m2").classList.add("active");
    }
    if (mid === "r1m4") {
      document.getElementById("line-r1m4-r2m2").classList.add("active");
    }
    if (mid === "r1m5") {
      document.getElementById("line-r1m5-r2m3").classList.add("active");
    }
    if (mid === "r1m6") {
      document.getElementById("line-r1m6-r2m3").classList.add("active");
    }
    if (mid === "r1m7") {
      document.getElementById("line-r1m7-r2m4").classList.add("active");
    }
    if (mid === "r1m8") {
      document.getElementById("line-r1m8-r2m4").classList.add("active");
    }

    if (mid === "r2m1") {
      document.getElementById("line-r2m1-r3m1").classList.add("active");
    }
    if (mid === "r2m2") {
      document.getElementById("line-r2m2-r3m1").classList.add("active");
    }
    if (mid === "r2m3") {
      document.getElementById("line-r2m3-r3m2").classList.add("active");
    }
    if (mid === "r2m4") {
      document.getElementById("line-r2m4-r3m2").classList.add("active");
    }

    if (mid === "r3m1") {
      document.getElementById("line-r3m1-final").classList.add("active");
    }
    if (mid === "r3m2") {
      document.getElementById("line-r3m2-final").classList.add("active");
    }

    if (match.id === "final") {
      document.getElementById("champion").textContent = winnerName;
    }
  }

  // 戻すボタン
  if (btn.classList.contains("undo")) {
    const slot = btn.closest(".slot");
    const match = btn.closest(".match");

    slot.querySelector(".name").textContent = "";

    const line = match.querySelector(".win-line");
    if (line) line.remove();

    match.querySelectorAll(".win").forEach(b => b.classList.remove("disabled"));

    const prevMatchId = slot.dataset.prev;
    if (prevMatchId) {
      const prevMatch = document.getElementById(prevMatchId);
      if (prevMatch) {
        prevMatch.querySelectorAll(".win").forEach(b => b.classList.remove("disabled"));
      }
    }

    delete slot.dataset.winner;

    /* ★ 線の赤を戻す */
    const mid = match.id;
    if (mid === "r1m1") {
      document.getElementById("line-r1m1-r2m1").classList.remove("active");
    }
    if (mid === "r1m2") {
      document.getElementById("line-r1m2-r2m1").classList.remove("active");
    }
    if (mid === "r1m3") {
      document.getElementById("line-r1m3-r2m2").classList.remove("active");
    }
    if (mid === "r1m4") {
      document.getElementById("line-r1m4-r2m2").classList.remove("active");
    }
    if (mid === "r1m5") {
      document.getElementById("line-r1m5-r2m3").classList.remove("active");
    }
    if (mid === "r1m6") {
      document.getElementById("line-r1m6-r2m3").classList.remove("active");
    }
    if (mid === "r1m7") {
      document.getElementById("line-r1m7-r2m4").classList.remove("active");
    }
    if (mid === "r1m8") {
      document.getElementById("line-r1m8-r2m4").classList.remove("active");
    }

    if (mid === "r2m1") {
      document.getElementById("line-r2m1-r3m1").classList.remove("active");
    }
    if (mid === "r2m2") {
      document.getElementById("line-r2m2-r3m1").classList.remove("active");
    }
    if (mid === "r2m3") {
      document.getElementById("line-r2m3-r3m2").classList.remove("active");
    }
    if (mid === "r2m4") {
      document.getElementById("line-r2m4-r3m2").classList.remove("active");
    }

    if (mid === "r3m1") {
      document.getElementById("line-r3m1-final").classList.remove("active");
    }
    if (mid === "r3m2") {
      document.getElementById("line-r3m2-final").classList.remove("active");
    }

    if (match.id === "final") {
      document.getElementById("champion").textContent = "";
    }
  }
});
</script>

</body>
</html>
