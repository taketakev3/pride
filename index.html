<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>16人トーナメント（縦型＋勝利ライン）</title>
<style>
  body { font-family: sans-serif; }

  .bracket {
    display: flex;
    gap: 60px;
    align-items: flex-start;
  }

  .round {
    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .match {
    position: relative;
    padding-left: 20px;
  }

  .slot {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 6px 0;
  }

  .name {
    width: 120px;
    padding: 4px;
    border: 1px solid #aaa;
    background: #fff;
  }

  .btn {
    padding: 3px 6px;
    font-size: 12px;
    cursor: pointer;
  }

  .win-line {
    position: absolute;
    width: 3px;
    background: red;
    left: 0px;
    bottom: 0;
    height: 0;
    transition: height 0.4s ease-out;
  }

  .disabled {
    opacity: 0.5;
    pointer-events: none;
  }
</style>
</head>
<body>

<h1>16人トーナメント（縦型＋勝利ライン）</h1>

<div class="bracket">

  <!-- 1回戦 -->
  <div class="round" id="round1">
    <h2>1回戦</h2>

    <div class="match" id="r1m1" data-next="r2m1">
      <div class="slot"><span class="name">P1</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P2</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m2" data-next="r2m1">
      <div class="slot"><span class="name">P3</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P4</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m3" data-next="r2m2">
      <div class="slot"><span class="name">P5</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P6</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m4" data-next="r2m2">
      <div class="slot"><span class="name">P7</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P8</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m5" data-next="r2m3">
      <div class="slot"><span class="name">P9</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P10</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m6" data-next="r2m3">
      <div class="slot"><span class="name">P11</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P12</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m7" data-next="r2m4">
      <div class="slot"><span class="name">P13</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P14</span><button class="btn win">勝ち</button></div>
    </div>

    <div class="match" id="r1m8" data-next="r2m4">
      <div class="slot"><span class="name">P15</span><button class="btn win">勝ち</button></div>
      <div class="slot"><span class="name">P16</span><button class="btn win">勝ち</button></div>
    </div>
  </div>

  <!-- 2回戦 -->
  <div class="round">
    <h2>2回戦</h2>

    <div class="match" id="r2m1" data-next="r3m1" data-prev="r1m1,r1m2">
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
    </div>

    <div class="match" id="r2m2" data-next="r3m1" data-prev="r1m3,r1m4">
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
    </div>

    <div class="match" id="r2m3" data-next="r3m2" data-prev="r1m5,r1m6">
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
    </div>

    <div class="match" id="r2m4" data-next="r3m2" data-prev="r1m7,r1m8">
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
    </div>
  </div>

  <!-- 準決勝 -->
  <div class="round">
    <h2>準決勝</h2>

    <div class="match" id="r3m1" data-next="final" data-prev="r2m1,r2m2">
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
    </div>

    <div class="match" id="r3m2" data-next="final" data-prev="r2m3,r2m4">
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
    </div>
  </div>

  <!-- 決勝 -->
  <div class="round">
    <h2>決勝</h2>

    <div class="match" id="final" data-prev="r3m1,r3m2">
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>
      <div class="slot"><span class="name"></span><button class="btn win">勝ち</button><button class="btn undo">戻す</button></div>

      <h3>優勝：<span id="champion"></span></h3>
    </div>
  </div>

</div>

<script>
document.addEventListener("click", e => {
  const btn = e.target;

  // 勝ちボタン
  if (btn.classList.contains("win")) {
    const slot = btn.closest(".slot");
    const winner = slot.querySelector(".name").textContent;

    const match = btn.closest(".match");
    const nextId = match.dataset.next;
    if (!nextId) return;

    // 勝った試合を記録
    match.dataset.winnerMatch = match.id;

    const nextMatch = document.getElementById(nextId);
    const nextSlots = nextMatch.querySelectorAll(".slot .name");

    for (const ns of nextSlots) {
      if (!ns.textContent) {
        ns.textContent = winner;
        break;
      }
    }

    let line = match.querySelector(".win-line");
    if (!line) {
      line = document.createElement("div");
      line.className = "win-line";
      match.appendChild(line);
    }

    const slotRect = slot.getBoundingClientRect();
    const matchRect = match.getBoundingClientRect();
    const height = slotRect.top - matchRect.top;

    line.style.height = height + "px";

    match.querySelectorAll(".win").forEach(b => b.classList.add("disabled"));

    if (nextId === "final") {
      const finalNames = nextMatch.querySelectorAll(".slot .name");
      const filled = [...finalNames].filter(n => n.textContent);
      if (filled.length === 2) {
        document.getElementById("champion").textContent = winner;
      }
    }
  }

  // 戻すボタン（勝った試合だけ復活）
  if (btn.classList.contains("undo")) {
    const match = btn.closest(".match");

    const slot = btn.closest(".slot");
    slot.querySelector(".name").textContent = "";

    const line = match.querySelector(".win-line");
    if (line) line.remove();

    match.querySelectorAll(".win").forEach(b => b.classList.remove("disabled"));

    // data-prev に書かれた試合のうち「勝った試合だけ」復活
    const prevIds = match.dataset.prev.split(",");
    prevIds.forEach(id => {
      const prevMatch = document.getElementById(id);
      if (prevMatch && prevMatch.dataset.winnerMatch) {
        prevMatch.querySelectorAll(".win").forEach(b => b.classList.remove("disabled"));
        delete prevMatch.dataset.winnerMatch;
      }
    });
  }
});
</script>

</body>
</html>
